<title>我的和牛地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 淺色為燕麥抹茶底、深色為焙茶夜色；左側地圖（縣依品牌數以焙茶色階上色、吃過的縣標圓章），右側清單；可切換「我吃過的」與「全日本品牌」 */
:root {
  --bg: #e9ebe3;
  --paper: #f4f5f0;
  --ink: #232820;
  --muted: #5a6153;
  --line: #d3d9c9;
  --land: #e3e6dd;
  --land-edge: #c3cab8;
  --sage: #4f6642;
  --sage-ink: #f4f5f0;
  --sage-soft: #dfe5d6;
  --g1: #e0d9c7;
  --g2: #c6b18c;
  --g3: #a2865c;
  --g4: #745c38;
  --warm: #2f3a28;
  --warm-soft: #ece3d2;
  --card: #f2f3ec;
  --card-edge: #cbd3c0;
  --danger: #9b3b2a;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1714; --paper: #231e1a; --ink: #efe6dc; --muted: #a89a8c; --line: #382f28;
    --land: #2d2621; --land-edge: #443930; --sage: #d2b08a; --sage-ink: #1b1714; --sage-soft: #362b22;
    --g1: #3b3027; --g2: #5a4634; --g3: #846547; --g4: #b8916a; --warm: #f0d3ad; --warm-soft: #3a2f22; --card: #29221d; --card-edge: #5a4634; --danger: #f0a08a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1714; --paper: #231e1a; --ink: #efe6dc; --muted: #a89a8c; --line: #382f28;
  --land: #2d2621; --land-edge: #443930; --sage: #d2b08a; --sage-ink: #1b1714; --sage-soft: #362b22;
  --g1: #3b3027; --g2: #5a4634; --g3: #846547; --g4: #b8916a; --warm: #f0d3ad; --warm-soft: #3a2f22; --card: #29221d; --card-edge: #5a4634; --danger: #f0a08a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; }
.title-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4.6vw, 40px); line-height: 1.2; margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 60ch; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-size: 26px; line-height: 1.1; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--sage); }
.stat span { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }

.modes { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; align-self: flex-start; }
.modes button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--sage); color: var(--sage-ink); }

.main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

.map-card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); }
@media (max-width: 860px) { .map-card { position: relative; top: auto; } }
svg.map { width: 100%; height: auto; display: block; max-height: 80vh; }
.pref { fill: var(--land); stroke: var(--land-edge); stroke-width: 0.8; stroke-linejoin: round; transition: fill .2s; }
.pref.c1 { fill: var(--g1); } .pref.c2 { fill: var(--g2); } .pref.c3 { fill: var(--g3); } .pref.c4 { fill: var(--g4); }
.pref.has { cursor: pointer; }
.pref.has:hover, .pref.on { stroke: var(--warm); stroke-width: 2.6; }
.pref.wide-hl { stroke: var(--warm); stroke-width: 2; stroke-dasharray: 5 3; }
.inset-box { fill: none; stroke: var(--land-edge); stroke-dasharray: 4 4; }
.inset-label { fill: var(--muted); font-family: var(--font-body); font-size: 15px; }
.pref-label { font-family: var(--font-body); font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; pointer-events: none; }
.badge { cursor: pointer; }
.badge circle { fill: var(--sage); stroke: var(--paper); stroke-width: 2; }
.badge text { fill: var(--sage-ink); font-family: var(--font-body); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }

.map-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.view-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); }
.view-switch button { font: inherit; font-size: 12px; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 4px 14px; border-radius: 999px; cursor: pointer; }
.view-switch button[aria-pressed="true"] { background: var(--sage); color: var(--sage-ink); }
.view-switch button:disabled { opacity: .45; cursor: not-allowed; }
.view-switch button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.map3d { position: relative; width: 100%; aspect-ratio: 5 / 4; max-height: 70vh; touch-action: none; border-radius: 10px; overflow: hidden; background: var(--paper); }
.map3d canvas { display: block; cursor: grab; }
.map3d canvas:active { cursor: grabbing; }
.map-card:not(.is-3d) .map3d { display: none; }
.map-card.is-3d svg.map { display: none; }
.map3d-overlay { position: absolute; inset: 0; pointer-events: none; }
.b3 { position: absolute; left: 0; top: 0; pointer-events: auto; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; cursor: pointer; margin: -11px 0 0 -11px; }
.b3 .n { width: 22px; height: 22px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--paper); }
.b3 .l { font-size: 12px; color: var(--ink); text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 3px var(--paper); white-space: nowrap; }
.map3d.narrow .b3 .l { display: none; }
.b3:focus-visible .n { outline: 2px solid var(--warm); outline-offset: 2px; }
.map3d-tip { position: absolute; left: 0; top: 0; pointer-events: none; font-size: 12px; background: var(--ink); color: var(--paper); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.map3d-hint { margin: 8px 4px 0; font-size: 12px; color: var(--muted); }
.compass { position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--card-edge); background: var(--paper); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
.compass .needle { position: relative; width: 14px; height: 28px; display: block; transition: none; }
.compass .needle i { position: absolute; left: 50%; top: 0; width: 0; height: 0; margin-left: -6px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 14px solid var(--sage); }
.compass .needle i::after { content: ""; position: absolute; left: -6px; top: 14px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 14px solid var(--land-edge); }
.compass .needle b { position: absolute; left: 50%; top: -15px; transform: translateX(-50%); font-size: 9px; font-weight: 700; color: var(--muted); display: none; }
.compass.off-north { border-color: var(--sage); }
.compass:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); padding: 10px 4px 0; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--land-edge); }
.legend .dot { border-radius: 50%; background: var(--sage); border-color: var(--sage); }

.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 13px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--sage-soft); border-color: var(--sage); color: var(--ink); }
.search { font: inherit; font-size: 14px; width: 100%; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.search::placeholder { color: var(--muted); }
:is(.chip, .modes button, .brand, .badge, .search):focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.focus-note { font-size: 13px; color: var(--muted); }

.region { display: flex; flex-direction: column; gap: 10px; }
.region h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 6px 0 0; display: flex; align-items: baseline; gap: 10px; }
.region h2 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.prefgroup { display: flex; flex-direction: column; gap: 8px; }
.prefname { font-size: 13px; color: var(--muted); margin: 6px 0 0; font-weight: 700; letter-spacing: 0.08em; display: flex; gap: 8px; align-items: baseline; }
.prefname span { font-weight: 400; letter-spacing: 0; }

.brand { background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; cursor: pointer; }
.brand:hover, .brand.on { border-color: var(--warm); }
.brand h3 { margin: 0; font-size: 17px; font-weight: 600; font-family: var(--font-display); }
.brand .where { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.brand p { grid-column: 1 / -1; margin: 2px 0 0; font-size: 14px; }
.brand .note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--card-edge); padding-top: 6px; margin-top: 4px; }
.tag { align-self: start; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--sage-soft); color: var(--ink); white-space: nowrap; }
.tag.alt { background: var(--warm-soft); }
.tag.unk { background: transparent; border: 1px solid var(--line); color: var(--muted); }

.rows { background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 14px; border-top: 1px solid var(--card-edge); align-items: center; }
.row:first-child { border-top: 0; }
.row .nm { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.row .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.row .m { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.row.eaten { background: var(--sage-soft); }
.row.eaten .tag:not(.alt):not(.unk) { background: var(--paper); }
.ate { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--sage); color: var(--sage-ink); white-space: nowrap; }
.empty { color: var(--muted); font-size: 14px; }
.pending .brand { border-style: dashed; cursor: default; }
.foot { font-size: 12px; color: var(--muted); }
.head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
@media (max-width: 640px) { .head-right { align-items: flex-start; } }
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.theme button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--muted); padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.theme button[aria-pressed="true"] { background: var(--sage-soft); color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.btn { font: inherit; font-size: 14px; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--card-edge); background: var(--paper); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--sage); border-color: var(--sage); color: var(--sage-ink); }
.btn.small { font-size: 12px; padding: 3px 10px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.box { background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.box h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--muted); }
.field label b { color: var(--danger); font-weight: 500; }
.field input, .field select, .field textarea { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-edge); background: var(--paper); color: var(--ink); width: 100%; }
.field textarea { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.err { font-size: 13px; color: var(--danger); min-height: 0; }
.msg { font-size: 13px; color: var(--ink); background: var(--sage-soft); border-radius: 8px; padding: 8px 12px; }
.msg.bad { color: var(--danger); background: var(--warm-soft); }
.mine { background: var(--sage); color: var(--sage-ink); }
.dup-group { display: flex; flex-direction: column; gap: 6px; }
.dup-group h3 { margin: 0; font-size: 15px; font-weight: 700; }
.dup-item { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; padding: 8px 12px; background: var(--paper); border: 1px solid var(--card-edge); border-radius: 8px; }
.dup-item .pf { color: var(--muted); font-size: 12px; min-width: 3em; }
.dup-item .vs { color: var(--muted); }
.brand .ops { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
:is(.btn, .theme button, .field input, .field select, .field textarea):focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .pref { transition: none; } }
</style>
